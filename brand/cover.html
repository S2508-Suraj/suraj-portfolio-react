<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1584px; height:396px; overflow:hidden; }

  .cover{
    position:relative; width:1584px; height:396px;
    background:
      radial-gradient(900px 520px at 68% 38%, rgba(124,100,255,.34), transparent 62%),
      radial-gradient(700px 460px at 18% 88%, rgba(66,88,190,.20), transparent 60%),
      linear-gradient(120deg,#070812 0%,#0b0d1a 46%,#11142a 100%);
    font-family:'Carlito','DejaVu Sans',sans-serif;
    overflow:hidden;
  }
  /* engineering grid, fading out to the edges */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image: radial-gradient(900px 400px at 50% 50%, #000 30%, transparent 85%);
  }
  /* soft diagonal sheen */
  .sheen{
    position:absolute; inset:-40% -10%;
    background:linear-gradient(104deg, transparent 38%, rgba(255,255,255,.045) 50%, transparent 62%);
  }

  .stage{ position:absolute; inset:0; display:flex; align-items:center; }

  /* ── monitors ───────────────────────────────── */
  .rig{ position:absolute; left:296px; top:74px; display:flex; gap:26px; align-items:flex-end; }
  .mon{ display:flex; flex-direction:column; align-items:center; }
  .bezel{
    width:224px; height:152px; border-radius:14px; padding:11px;
    background:linear-gradient(160deg,#252c44 0%,#171c2e 55%,#12162486 100%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      0 26px 46px -18px rgba(0,0,0,.85),
      0 0 0 1px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.10);
  }
  .mon.back .bezel{ transform:translateY(16px) scale(.94); }
  .screen{
    width:100%; height:100%; border-radius:7px; padding:14px;
    background:linear-gradient(165deg,#1b2238 0%,#141a2c 100%);
    box-shadow:inset 0 0 26px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.045);
    display:flex; flex-direction:column; gap:9px; overflow:hidden; position:relative;
  }
  .screen::after{ /* glass reflection */
    content:''; position:absolute; inset:0;
    background:linear-gradient(145deg, rgba(255,255,255,.10), transparent 42%);
  }
  .ln{ height:7px; border-radius:4px; background:#39435f; }
  .ln.a{ width:66%; background:linear-gradient(90deg,#7c64ff,#5b46d6); }
  .ln.b{ width:44%; }
  .ln.c{ width:80%; }
  .ln.d{ width:34%; background:linear-gradient(90deg,#7c64ff,#5b46d6); opacity:.75; }
  .ln.e{ width:58%; }

  .bar{ height:14px; border-radius:5px; background:#39435f; width:100%; }
  .cards{ display:flex; gap:8px; }
  .card{ flex:1; height:44px; border-radius:7px; background:#2a3149; }
  .card.on{ background:linear-gradient(160deg,#7c64ff,#5340c9); box-shadow:0 6px 16px -6px rgba(124,100,255,.8); }

  .neck{ width:16px; height:20px; background:linear-gradient(180deg,#232a40,#171c2c); }
  .foot{ width:88px; height:8px; border-radius:5px; background:linear-gradient(180deg,#252c44,#161b2a);
         box-shadow:0 10px 22px -10px rgba(0,0,0,.9); }
  .cap{ margin-top:13px; font-family:'DejaVu Sans Mono',monospace; font-size:13px;
        letter-spacing:.14em; color:#6a7391; text-transform:uppercase; }

  /* ── text block ─────────────────────────────── */
  .id{ position:absolute; right:96px; top:50%; transform:translateY(-50%); text-align:right; }
  .name{
    font-size:62px; font-weight:700; letter-spacing:-.022em; line-height:1;
    color:#f2f4fb; text-shadow:0 2px 26px rgba(124,100,255,.34);
  }
  .role{
    margin-top:16px; font-family:'DejaVu Sans Mono',monospace;
    font-size:20px; letter-spacing:.02em; color:#a596ff;
  }
  .rule{ margin:19px 0 0 auto; width:132px; height:2px;
         background:linear-gradient(90deg, transparent, #7c64ff); }
  .stack{ margin-top:18px; font-size:17.5px; letter-spacing:.015em; color:#8e96b0; }
  .url{ margin-top:11px; font-family:'DejaVu Sans Mono',monospace; font-size:14px;
        letter-spacing:.06em; color:#5c6480; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="sheen"></div>

    <div class="rig">
      <div class="mon">
        <div class="bezel"><div class="screen">
          <div class="ln a"></div><div class="ln b"></div><div class="ln c"></div>
          <div class="ln d"></div><div class="ln e"></div><div class="ln b"></div>
        </div></div>
        <div class="neck"></div><div class="foot"></div>
        <div class="cap">C# · .NET</div>
      </div>

      <div class="mon back">
        <div class="bezel"><div class="screen">
          <div class="bar"></div>
          <div class="cards"><div class="card"></div><div class="card on"></div><div class="card"></div></div>
          <div class="ln c"></div><div class="ln b"></div>
        </div></div>
        <div class="neck"></div><div class="foot"></div>
        <div class="cap">React</div>
      </div>
    </div>

    <div class="id">
      <div class="name">Suraj Kesharwani</div>
      <div class="role">.NET Developer &nbsp;|&nbsp; Full-Stack &amp; Backend</div>
      <div class="rule"></div>
      <div class="stack">SQL Server &nbsp;·&nbsp; IIS &nbsp;·&nbsp; GitHub Actions &nbsp;·&nbsp; Agile/Scrum</div>
      <div class="url">surajkesharwani.vercel.app</div>
    </div>
  </div>
</body>
</html>
